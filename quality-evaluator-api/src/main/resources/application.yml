spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}?sslmode=require
    hikari:
      data-source-properties:
        ssl: true
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: simple

# ── GitHub OAuth Config ─────────────────────────────────────────────
github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI}

# ── IA (Groq) ──────────────────────────────────────────────────────
groq:
  api-key: ${GROQ_API_KEY}
  model: llama-3.3-70b-versatile

# ── Server ─────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

# ── Actuator / Monitoring ───────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# ── JWT ────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}

# ── Swagger ────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    use-root-path: true

# ── Frontend URL (usado no OAuth flow) ─────────────────────────────
app:
  frontend:
    url: ${APP_FRONTEND_URL}